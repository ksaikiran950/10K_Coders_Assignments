<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script</title>
</head>
<body>
    <h2>What can JavaScript do ?</h2>
    <p id="demo">It can change the Html content</p>
    <button onclick='document.getElementById("demo").innerHTML = "Hello JavaScript!"'>Click Me</button>

    <p>In the below case change the value the src(source) attribute of an image</p>


    <p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="document.getElementById('myImage').src='On.gif'">Turn on the light</button>

<img id="myImage" src="/off.gif" style="width:100px">

<button onclick="document.getElementById('myImage').src='off.gif'">Turn off the light</button>

</body>
</html>
