<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb On Off Project</title>
    <style>
        body{
            text-align: center;
            margin-top: 80px;
            font-family: Arial, Helvetica, sans-serif;

        }
        button{
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;

        }
    </style>
</head>
<body>
    <h2>Bulb On / Off Project</h2>

    <img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif" alt="" width="120">

    <br><br>

    <button onclick="turnon()"> Turn On </button>
    <button onclick="turnoff()"> Turn Off </button>

    <script>
        function turnon(){
            document.getElementById("bulb").src ="https://www.w3schools.com/js/pic_bulbon.gif";
        }
        function turnoff(){
            document.getElementById("bulb").src="https://www.w3schools.com/js/pic_bulboff.gif"
        }
    </script>
</body>
</html>
