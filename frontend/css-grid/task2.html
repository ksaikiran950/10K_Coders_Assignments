<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-2</title>
    <style>
        .container{
            height: 100vh;
            gap: 10px;
            background-color: black;
            display: grid;
            grid-template-areas: 
            'child1 child1 child2'
            'child3 child4 child2';

        }
        .child1{
            background-color: red;
            grid-area: child1;

        }
        .child2{
            background-color: orange;
            grid-area: child2;
            
        }
        .child3{
            background-color: green;
            grid-area: child3;
        }
        .child4{
            background-color: violet;
            grid-area: child4;
        }
    </style>
</head>
<body>
    <a href="main.html">Go to Home Page</a>
    <div class="container">
        <div class="child1"></div>
        <div class="child2"></div>
        <div class="child3"></div>
        <div class="child4"></div>
    </div>
</body>
</html>
