<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height: 100vh;
            /* width: 100vw; */
            display: grid;
            gap: 10px;
            grid-template-areas:
            'img1 img2 img3' 
            'img4 img5 img6';
        }


        .parent>*{
            /* background-color: chartreuse; */
            height: 600px;
            width: 500px;
        }
        .img1{
            grid-area: img1;
        }
        .img2{
            grid-area: img2;
        }
        .img3{
            grid-area: img3;
        }
        .img4{
            grid-area: img4;
        }
        .img5{
            grid-area: img5;
        }
        .img6{
            grid-area: img6;
        }

        @media screen and (min-width: 320px )and (max-width: 426px){
            .parent{
            height: 100vh;
            display: flex;
            gap: 10px;
            flex-direction: column;
                        
        }
    }
    </style>
</head>
<body>
    <div class="parent">
        <img src="https://tse3.mm.bing.net/th/id/OIP.7jpR1fZDpLLZXmA3eKv-_AHaFC?rs=1&pid=ImgDetMain&o=7&rm=3" alt="" class="img1">

        <img src="https://tse4.mm.bing.net/th/id/OIP.bZ6fCu2s1fsoUSNBxsJouQHaEK?rs=1&pid=ImgDetMain&o=7&rm=3" alt="" class="img3">
        <img src="https://th.bing.com/th/id/R.ac54341504588eedd651ff867f1ef949?rik=JYmQaMVSULpYQg&riu=http%3a%2f%2fthewowstyle.com%2fwp-content%2fuploads%2f2015%2f01%2fnature-images.jpg&ehk=BNPsuSOUR7ATZ3EpRwxx1xFl7LUbO3tYlu1wFLCBrCE%3d&risl=&pid=ImgRaw&r=0" alt="" class="img4">
        <img src="https://th.bing.com/th/id/R.6a7a745d0cf6e1478e104e6a7fee6cc1?rik=xULJFzGntGDtew&riu=http%3a%2f%2fwonderfulengineering.com%2fwp-content%2fuploads%2f2016%2f01%2fnature-wallpapers-38.jpg&ehk=dUtU7hvI%2bIv1ZAogg0%2b%2fznLW5KEYTsPob9LlywpnX1Q%3d&risl=&pid=ImgRaw&r=0" alt="" class="img5">
